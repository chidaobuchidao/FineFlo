<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<!-- Enterprise Sidebar Fragment -->
<th:block th:fragment="sidebar(currentPage)">
    <aside class="enterprise-sidebar" id="enterprise-sidebar">
        <div class="sidebar-header">
            <a href="/enterprise/loans" class="sidebar-brand">
                <div class="sidebar-logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M12 9v4M12 17h.01"/>
                    </svg>
                </div>
                <span class="sidebar-brand-text">普惠金融<br>企业版</span>
            </a>
        </div>

        <nav class="sidebar-nav">
            <div class="sidebar-section-title">贷款管理</div>
            <a href="/enterprise/loans"
               class="sidebar-link"
               th:classappend="${currentPage == 'loans'} ? 'active'">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="2" y="3" width="20" height="14" rx="2"/>
                    <line x1="8" y1="21" x2="16" y2="21"/>
                    <line x1="12" y1="17" x2="12" y2="21"/>
                </svg>
                贷款列表
            </a>
            <a href="/enterprise/loans/apply"
               class="sidebar-link"
               th:classappend="${currentPage == 'apply'} ? 'active'">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <line x1="12" y1="8" x2="12" y2="16"/>
                    <line x1="8" y1="12" x2="16" y2="12"/>
                </svg>
                贷款申请
            </a>

            <div class="sidebar-section-title">还款管理</div>
            <a href="/enterprise/repayments"
               class="sidebar-link"
               th:classappend="${currentPage == 'repayments'} ? 'active'">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                </svg>
                还款计划
            </a>
            <a href="/enterprise/overdue"
               class="sidebar-link"
               th:classappend="${currentPage == 'overdue'} ? 'active'">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12,6 12,12 16,14"/>
                </svg>
                逾期记录
            </a>

            <div class="sidebar-section-title">工具箱</div>
            <a href="/enterprise/calculator"
               class="sidebar-link"
               th:classappend="${currentPage == 'calculator'} ? 'active'">
                <svg class="sidebar-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="2" width="16" height="20" rx="2"/>
                    <line x1="8" y1="6" x2="16" y2="6"/>
                    <line x1="8" y1="10" x2="16" y2="10"/>
                    <line x1="8" y1="14" x2="12" y2="14"/>
                </svg>
                贷款计算器
            </a>
        </nav>

        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-avatar" th:text="${user?.realName != null ? #strings.substring(user.realName, 0, 1) : '企'}">企</div>
                <div class="sidebar-user-info">
                    <div class="sidebar-user-name" th:text="${user?.realName} ?: '企业用户'">企业用户</div>
                    <div class="sidebar-user-role">企业端</div>
                </div>
                <button class="btn btn-ghost btn-sm" onclick="logout()" title="退出登录" style="padding:var(--space-1);min-width:32px;">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16,17 21,12 16,7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </button>
            </div>
        </div>
    </aside>

    <!-- Mobile overlay -->
    <div class="sidebar-overlay" id="sidebar-overlay"></div>
</th:block>
</html>
