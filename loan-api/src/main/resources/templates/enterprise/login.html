<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/enterprise-layout}">

<th:block layout:fragment="extra-head">
    <link rel="stylesheet" th:href="@{/css/enterprise-login.css}">
</th:block>

<th:block layout:fragment="content">
    <div class="auth-page">
        <!-- Particle Background -->
        <canvas id="particles-canvas"></canvas>

        <!-- Login Card -->
        <div class="auth-card">
            <div class="auth-header">
                <div class="auth-logo">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="M12 9v4M12 17h.01"/>
                    </svg>
                </div>
                <h1 class="auth-title">企业用户登录</h1>
                <p class="auth-subtitle">普惠金融管理平台 · 企业版</p>
            </div>

            <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label" for="username">用户名</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input type="text" id="username" class="form-input" placeholder="请输入用户名" required autofocus>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">密码</label>
                    <div class="input-icon-wrapper">
                        <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input type="password" id="password" class="form-input" placeholder="请输入密码" required>
                    </div>
                </div>

                <div id="login-error" style="color:var(--color-danger);font-size:var(--text-sm);display:none;"></div>

                <button type="submit" class="btn btn-primary btn-lg" id="login-btn">
                    登 录
                </button>
            </form>

            <div class="auth-footer">
                还没有账号？<a href="/enterprise/register">立即注册</a>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('login-btn');
            const errorEl = document.getElementById('login-error');

            btn.disabled = true;
            btn.textContent = '登录中...';
            errorEl.style.display = 'none';

            try {
                const res = await authApi.login(username, password);
                setToken(res.data.token);
                setUser(res.data.user);
                window.location.href = '/enterprise/loans';
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
                btn.disabled = false;
                btn.textContent = '登 录';
            }
        }
    </script>
</th:block>

</html>
