<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/enterprise-layout}">

<th:block layout:fragment="content">
    <div class="enterprise-layout">
        <th:block th:replace="~{fragments/sidebar :: sidebar(currentPage='calculator')}"></th:block>

        <div class="enterprise-main">
            <th:block th:replace="~{fragments/topbar :: topbar(title='贷款计算器')}"></th:block>

            <div class="page-content">
                <div class="page-header fade-in">
                    <div class="page-header-left">
                        <h2>贷款计算器</h2>
                        <p>预估还款金额，支持等额本息与等额本金两种模式</p>
                    </div>
                </div>

                <div class="calculator-grid fade-in fade-in-delay-1">
                    <!-- Input -->
                    <div class="glass-card" style="padding: var(--space-8);">
                        <h4 style="margin-bottom: var(--space-6);">贷款参数</h4>
                        <div style="display: flex; flex-direction: column; gap: var(--space-6);">
                            <div class="form-group">
                                <label class="form-label" for="calc-amount">贷款金额（元）</label>
                                <input type="number" id="calc-amount" class="form-input" placeholder="如 500000"
                                       value="500000" min="10000" step="1">
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="calc-term">贷款期限（月）</label>
                                <select id="calc-term" class="form-select">
                                    <option value="3">3 个月</option>
                                    <option value="6">6 个月</option>
                                    <option value="12" selected>12 个月</option>
                                    <option value="24">24 个月</option>
                                    <option value="36">36 个月</option>
                                    <option value="48">48 个月</option>
                                    <option value="60">60 个月</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="calc-rate">年利率</label>
                                <div class="input-icon-wrapper">
                                    <input type="number" id="calc-rate" class="form-input" value="4.35" min="0.1" max="24" step="0.01">
                                    <span style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--color-text-muted);font-size:var(--text-sm);">%</span>
                                </div>
                                <span class="form-hint">参考范围：3.5% ~ 15%</span>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="calc-mode">还款方式</label>
                                <select id="calc-mode" class="form-select" onchange="runCalculator()">
                                    <option value="EQUAL_INSTALLMENT" selected>等额本息（每月还款额相同）</option>
                                    <option value="EQUAL_PRINCIPAL">等额本金（每月本金相同，利息递减）</option>
                                </select>
                            </div>

                            <button class="btn btn-primary btn-lg" onclick="runCalculator()" style="margin-top: var(--space-2);">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <polyline points="22,12 18,12 15,21 9,3 6,12 2,12"/>
                                </svg>
                                计算
                            </button>
                        </div>
                    </div>

                    <!-- Result -->
                    <div>
                        <div class="glass-card" style="padding: var(--space-8); margin-bottom: var(--space-6);">
                            <h4 style="margin-bottom: var(--space-6);">还款预估</h4>
                            <div class="calculator-result">
                                <div class="calculator-result-item">
                                    <span class="calculator-result-label">月还款额（首期）</span>
                                    <span class="calculator-result-value highlight" id="calc-monthly">—</span>
                                </div>
                                <div class="calculator-result-item">
                                    <span class="calculator-result-label">总利息</span>
                                    <span class="calculator-result-value" id="calc-interest">—</span>
                                </div>
                                <div class="calculator-result-item">
                                    <span class="calculator-result-label">总还款额</span>
                                    <span class="calculator-result-value" id="calc-total">—</span>
                                </div>
                            </div>
                        </div>

                        <!-- Schedule -->
                        <div class="glass-card" style="padding: var(--space-8);">
                            <h4 style="margin-bottom: var(--space-4);">还款明细表</h4>
                            <div class="data-table-wrapper schedule-table" style="max-height: 400px;">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>期数</th>
                                            <th>本金</th>
                                            <th>利息</th>
                                            <th>月供</th>
                                            <th>剩余本金</th>
                                        </tr>
                                    </thead>
                                    <tbody id="calc-schedule-body">
                                        <tr><td colspan="5" class="empty-state">输入参数后点击"计算"</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</th:block>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/enterprise-calculator.js}"></script>
    <script th:src="@{/js/enterprise-loan.js}"></script>
</th:block>

</html>
