worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css text/xml;

    upstream loan_api {
        server loan-api:8081;
    }

    upstream risk_engine {
        server risk-engine:5000;
    }

    server {
        listen 80;
        server_name localhost;

        # Vue static frontend (when built)
        location / {
            root   /usr/share/nginx/html;
            index  index.html;
            try_files $uri $uri/ /index.html;
        }

        # API proxy to loan-api
        location /api/ {
            proxy_pass http://loan_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Risk engine proxy
        location /risk/ {
            proxy_pass http://risk_engine;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
