version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: inclusive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inclusive_finance}
      MYSQL_USER: ${MYSQL_USER:-fin_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-fin_pass_2026}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root123456}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: inclusive-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis123}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis123}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: inclusive-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - loan-api

  eureka-server:
    build:
      context: ../eureka-server
      dockerfile: Dockerfile
    container_name: inclusive-eureka
    restart: unless-stopped
    ports:
      - "${EUREKA_PORT:-8761}:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  loan-api:
    build:
      context: ../loan-api
      dockerfile: Dockerfile
    container_name: inclusive-loan-api
    restart: unless-stopped
    ports:
      - "${LOAN_API_PORT:-8081}:8081"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/inclusive_finance?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-fin_user}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-fin_pass_2026}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD:-redis123}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      RISK_ENGINE_URL: http://risk-engine:5000
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      eureka-server:
        condition: service_healthy

  risk-engine:
    build:
      context: ../risk-engine
      dockerfile: Dockerfile
    container_name: inclusive-risk-engine
    restart: unless-stopped
    ports:
      - "${RISK_ENGINE_PORT:-5000}:5000"
    environment:
      EUREKA_SERVER: http://eureka-server:8761/eureka/
      FLASK_ENV: production
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
    depends_on:
      eureka-server:
        condition: service_healthy

volumes:
  mysql-data:
  redis-data:
